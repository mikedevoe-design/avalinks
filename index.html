<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root {
    --bg: #160c14; --panel: #1e0f1b; --card: #2a1626; --line: #3b2035;
    --text: #fff3fa; --muted: #c79cb7; --accent: #ff4fa3; --accent2: #ff8cc8;
    --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: rgba(22,12,20,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(var(--top) + 10px) 12px 10px; border-bottom: 1px solid var(--line); }
  .hrow { display: flex; align-items: center; gap: 10px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: var(--card); flex: none; }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn.on { background: var(--accent); color: #fff; }
  .logo { flex: 1; margin: 0; font-size: 24px; font-weight: 900; letter-spacing: .04em;
    background: linear-gradient(90deg, #ff8cc8, #ff4fa3 55%, #ff2d7a);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #searchRow { display: none; margin-top: 10px; position: relative; }
  body.searching #searchRow { display: block; }
  #search { width: 100%; padding: 11px 40px 11px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; outline: none; -webkit-appearance: none; }
  #search:focus { border-color: var(--accent); }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  #searchClear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;
    border-radius: 50%; color: var(--muted); font-size: 18px; display: none; }
  body.has-query #searchClear { display: block; }

  /* Quick filter chips */
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--card);
    font-size: 14px; color: var(--muted); white-space: nowrap; }
  .chip.on { background: var(--accent); color: #fff; font-weight: 600; }

  /* Grid */
  main { padding: 6px 12px calc(var(--bottom) + 30px); max-width: 760px; margin: 0 auto; }
  #viewLine { color: var(--muted); font-size: 13px; margin: 6px 2px 10px; min-height: 1em; }
  #viewLine b { color: var(--text); font-weight: 600; }
  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 600px) { #grid { grid-template-columns: repeat(3, 1fr); } }
  .card { position: relative; border-radius: 14px; overflow: hidden; background: var(--card); }
  .card > .open { display: block; width: 100%; text-align: left; }
  .thumb { position: relative; aspect-ratio: 9 / 14; background: #000; overflow: hidden; }
  .thumb img, .splace img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .noimg { background: linear-gradient(160deg, #3a1f33, #1a0d17); }
  .noimg::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-40%, -50%);
    border-style: solid; border-width: 16px 0 16px 26px; border-color: transparent transparent transparent rgba(255,255,255,.55); }
  .badge-new { position: absolute; top: 8px; left: 8px; z-index: 1; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 6px; letter-spacing: .04em; }
  .fav { position: absolute; top: 6px; right: 6px; z-index: 2; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.45); display: grid; place-items: center; }
  .fav svg { width: 18px; height: 18px; }
  .card .info { padding: 8px 10px 10px; }
  .card .t { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .status { color: var(--muted); text-align: center; padding: 50px 16px; line-height: 1.5; grid-column: 1 / -1; }

  /* Drawer (sidebar) */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 20; }
  #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(80vw, 320px); background: var(--panel);
    z-index: 21; transform: translateX(-102%); transition: transform .25s ease; overflow-y: auto;
    padding: calc(var(--top) + 16px) 10px calc(var(--bottom) + 20px); border-right: 1px solid var(--line); }
  body.menu-open #drawer { transform: none; }
  body.menu-open #scrim { opacity: 1; pointer-events: auto; }
  #drawer .logo { display: block; margin: 4px 10px 14px; font-size: 26px; }
  #drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 20px 10px 6px; font-weight: 600; }
  .navitem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 10px;
    border-radius: 10px; font-size: 16px; text-align: left; }
  .navitem.on { background: var(--card); color: var(--accent2); }
  .navitem .ic { width: 24px; text-align: center; font-size: 17px; }
  .navitem .n { margin-left: auto; color: var(--muted); font-size: 14px; }

  /* Swipe player */
  #player { position: fixed; inset: 0; z-index: 30; background: #000; display: none; }
  #player.open { display: block; }
  #feed { position: absolute; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .slide { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column;
    padding: calc(var(--top) + 60px) 0 calc(var(--bottom) + 12px); }
  .sframe { flex: 1; position: relative; }
  .sframe iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .splace { position: absolute; inset: 0; }
  .splace img { object-fit: contain; }
  .sinfo { padding: 10px 70px 0 16px; }
  .snote { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .smeta { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .shint { font-size: 12px; color: #8a6f80; margin-top: 8px; }
  .ptop { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(var(--top) + 8px) 10px 8px; pointer-events: none; }
  .ptop > * { pointer-events: auto; }
  .ptop .iconbtn { background: rgba(40,20,36,.85); }
  #pPos { flex: 1; text-align: center; font-size: 14px; color: var(--muted); pointer-events: none; }
  .pill { padding: 9px 13px; border-radius: 999px; background: rgba(40,20,36,.85); font-size: 13px; }
  .pill.on { background: var(--accent); color: #fff; }
  .pside { position: absolute; right: 8px; bottom: calc(var(--bottom) + 18px); display: flex; flex-direction: column;
    gap: 10px; pointer-events: none; }
  .pside button { pointer-events: auto; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(40,20,36,.85); display: grid; place-items: center; }
  .pside svg { width: 24px; height: 24px; }
  .pside button:disabled { opacity: .3; }
  .pside .speed { font-size: 16px; font-weight: 800; }
  .pside .speed.on { background: var(--accent); color: #fff; }
</style>
</head>

<header>

    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>

  <span class="logo">AVA TOK</span>

<div id="player" role="dialog" aria-modal="true">

    </button>

    </button>

<script>
/* ================== SETUP ==================
   Google Sheet columns (row 1 is headers):
     A: Link   B: Note   C: From   D: Category (optional, e.g. "Funny" or "Funny, Animals")
*/
const SHEET_ID = "1bKKAXUmcgJBoTrOnxtt9M0DX5lxjD63WE79VAIJX6KM";
const SHEET_TAB = ""; // blank = first tab
// Your Google Apps Script web app (also used by the Share shortcut). It looks up video details and pictures.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYW7z2kZsKCfcDeHLTSzj-CXgVUdBM8BypigA3ZfapdWCOHf5uo31ErNP532n-UHOXjQ/exec";
/* =========================================== */

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let seen = store.get("seenVideos", {});
let favs = store.get("favVideos", {});
let meta = store.get("videoMeta3", {});   // link -> {id, title, author, thumb, at, ok}
let autoNext = store.get("autoNext", true);
let videos = [];                           // [{link, note, from, cats[], id, title, author, thumb}]
let view = store.get("lastView", { type: "all" });
let query = "";
let current = [];                          // videos in the current list, in order
let activeIndex = -1;

const HEART_ON = '<svg viewBox="0 0 24 24" fill="#ff4fa3"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.9 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>';
const HEART_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.9 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>';

/* ---------- Sheet + TikTok helpers ---------- */
function parseCSV(text) {
  const rows = []; let row = []; let cell = ""; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function hostOf(url) { try { return new URL(url).hostname.toLowerCase(); } catch (e) { return ""; } }
function isTikTok(url) { return /(^|\.)tiktok\.com$/.test(hostOf(url)); }
function isYouTube(url) { return /(^|\.)(youtube\.com|youtu\.be)$/.test(hostOf(url)); }
function platformOf(url) { return isTikTok(url) ? "tiktok" : isYouTube(url) ? "youtube" : null; }
// youtu.be/ID, youtube.com/watch?v=ID, /shorts/ID, /embed/ID, /live/ID
function ytIdFromUrl(url) {
  let u; try { u = new URL(url); } catch (e) { return null; }
  const ok = id => (id && /^[\w-]{11}$/.test(id) ? id : null);
  if (/(^|\.)youtu\.be$/i.test(u.hostname)) return ok(u.pathname.split("/")[1]);
  const v = u.searchParams.get("v"); if (v) return ok(v);
  const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);
  return m ? m[1] : null;
}
function isProfile(url) { return /tiktok\.com\/@[\w.\-]+\/?(?:[?#].*)?$/i.test(url); }
function idFromUrl(url) {
  const m = url.match(/\/(?:video|photo|player\/v1|embed(?:\/v2)?)\/(\d{8,})/);
  return m ? m[1] : null;
}
function authorFromUrl(url) {
  const m = url.match(/tiktok\.com\/@([\w.\-]+)\//i);
  return m ? m[1] : "";
}
function splitCats(s) {
  return (s || "").split(/[,;\/]/).map(x => x.trim()).filter(Boolean)
    .map(x => x.charAt(0).toUpperCase() + x.slice(1));
}

// Runs at most `n` lookups at once, so the Google script isn't flooded.
function limiter(n) {
  let running = 0; const queue = [];
  const next = () => {
    if (running >= n || !queue.length) return;
    running++;
    const { fn, res } = queue.shift();
    fn().then(res, () => res(null)).finally(() => { running--; next(); });
  };
  return fn => new Promise(res => { queue.push({ fn, res }); next(); });
}
const scriptQueue = limiter(4);

// TikTok's oEmbed info (caption, creator, thumbnail). TikTok may refuse a web page
// directly, so the Google script fetches it as a fallback.
async function fetchOembed(link, platform) {
  const direct = platform === "youtube"
    ? "https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(link)
    : "https://www.tiktok.com/oembed?url=" + encodeURIComponent(link);
  try {
    const r = await fetch(direct);
    if (r.ok) { const j = await r.json(); if (j && (j.title || j.thumbnail_url || j.html)) return j; }
  } catch (e) {}
  if (!SCRIPT_URL) return null;
  return scriptQueue(async () => {
    const r = await fetch(SCRIPT_URL + "?meta=" + encodeURIComponent(link));
    if (!r.ok) return null;
    const j = JSON.parse(await r.text());
    return j && (j.title || j.thumbnail_url || j.author_unique_id || j.html) ? j : null;
  });
}

// Looks up title, creator and thumbnail (cached for a day; TikTok's picture links expire).
// `who` is the creator as shown on her page: "@handle" for TikTok, the channel for YouTube.
async function lookup(link, platform) {
  const cached = meta[link];
  if (cached && cached.id && cached.ok && Date.now() - cached.at < 864e5) return cached;
  if (platform === "youtube") return lookupYouTube(link, cached);
  const fromUrl = authorFromUrl(link);
  const out = { platform: "tiktok", id: idFromUrl(link) || (cached && cached.id) || null, title: "",
    who: fromUrl ? "@" + fromUrl : "", thumb: "", at: Date.now(), ok: false };
  const j = await fetchOembed(link, "tiktok");
  if (j) {
    const html = j.html || "";
    if (/data-embed-type="creator"/.test(html)) return null; // a profile, not a video
    out.id = out.id || j.embed_product_id || (html.match(/data-video-id="(\d+)"/) || [])[1] || null;
    out.title = j.title || "";
    const handle = j.author_unique_id || fromUrl;
    out.who = handle ? "@" + handle : (j.author_name || "");
    out.thumb = j.thumbnail_url || "";
    out.ok = true;
  } else if (cached) {
    out.title = cached.title || ""; out.thumb = cached.thumb || "";
    out.who = out.who || cached.who || "";
  }
  if (!out.id) return null;
  meta[link] = out;
  return out;
}
async function lookupYouTube(link, cached) {
  const id = ytIdFromUrl(link);
  if (!id) return null; // a channel or playlist, not a single video
  const out = { platform: "youtube", id, title: "", who: "",
    thumb: "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg", at: Date.now(), ok: false };
  const j = await fetchOembed(link, "youtube");
  if (j) {
    out.title = j.title || "";
    const handle = (String(j.author_url || "").match(/youtube\.com\/(@[\w.\-]+)/i) || [])[1];
    out.who = handle || j.author_name || "";
    out.ok = true;
  } else if (cached) { out.title = cached.title || ""; out.who = cached.who || ""; }
  meta[link] = out;
  return out;
}

/* ---------- Pictures ---------- */
const picCache = {}; // link -> data: URL from the Google script (kept while the page is open)
async function scriptPicture(link) {
  if (picCache[link]) return picCache[link];
  if (!SCRIPT_URL) return null;
  const data = await scriptQueue(async () => {
    const r = await fetch(SCRIPT_URL + "?thumb=" + encodeURIComponent(link));
    if (!r.ok) return null;
    const j = JSON.parse(await r.text());
    return j && j.data ? j.data : null;
  });
  if (data) picCache[link] = data;
  return data;
}
// Puts the video's cover picture into `box`: straight from TikTok if it allows it,
// otherwise through the Google script; a plain play-button tile if neither works.
const lazyPics = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) { lazyPics.unobserve(en.target); en.target._load(); } });
}, { rootMargin: "400px" }) : null;
function setPicture(box, v) {
  const fallback = () => { box.classList.add("noimg"); };
  const viaScript = async () => {
    const d = await scriptPicture(v.link);
    if (d) { const img = new Image(); img.alt = ""; img.src = d; box.appendChild(img); } else fallback();
  };
  box._load = () => {
    if (picCache[v.link]) return viaScript();
    if (!v.thumb) return v.platform === "youtube" ? fallback() : viaScript();
    const img = new Image(); img.alt = ""; img.referrerPolicy = "no-referrer"; img.decoding = "async";
    img.onerror = () => { img.remove(); if (v.platform === "youtube") fallback(); else viaScript(); };
    img.src = v.thumb; box.appendChild(img);
  };
  if (lazyPics) lazyPics.observe(box); else box._load();
}

function playerUrl(v) {
  if (v.platform === "youtube") {
    const p = new URLSearchParams({ autoplay: "1", playsinline: "1", rel: "0", modestbranding: "1",
      iv_load_policy: "3", enablejsapi: "1" });
    if (/^https?:$/.test(location.protocol)) p.set("origin", location.origin);
    return "https://www.youtube-nocookie.com/embed/" + v.id + "?" + p.toString();
  }
  const p = new URLSearchParams({ rel: "0", music_info: "0", description: "0", native_context_menu: "0",
    closed_caption: "1", autoplay: "1", loop: "0" });
  return "https://www.tiktok.com/player/v1/" + v.id + "?" + p.toString();
}

/* ---------- Lists ---------- */
function inView(v, vw) {
  if (vw.type === "new") return !seen[v.link];
  if (vw.type === "fav") return !!favs[v.link];
  if (vw.type === "cat") return v.cats.includes(vw.name);
  if (vw.type === "uncat") return v.cats.length === 0;
  if (vw.type === "creator") return v.who === vw.name;
  if (vw.type === "tiktok" || vw.type === "youtube") return v.platform === vw.type;
  return true;
}
function matchesQuery(v) {
  if (!query) return true;
  const hay = [v.note, v.title, v.who, v.from, v.platform, v.cats.join(" ")].join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function viewLabel(vw) {
  if (vw.type === "creator") return vw.name;
  return { all: "All videos", new: "New", fav: "Favorites", uncat: "No category", tiktok: "TikTok", youtube: "YouTube" }[vw.type] || vw.name;
}
function sameView(a, b) { return a.type === b.type && (a.name || "") === (b.name || ""); }
function tally(getter) {
  const counts = {};
  videos.forEach(v => [].concat(getter(v)).forEach(k => { if (k) counts[k] = (counts[k] || 0) + 1; }));
  return counts;
}
function allCategories() {
  const c = tally(v => v.cats);
  return Object.keys(c).sort((a, b) => a.localeCompare(b)).map(name => ({ name, n: c[name] }));
}
function allCreators() {
  const c = tally(v => v.who);
  return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b)).map(name => ({ name, n: c[name] }));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function navButton(vw, icon, label, n) {
  const b = el("button", "navitem" + (sameView(vw, view) ? " on" : ""));
  b.type = "button";
  b.appendChild(el("span", "ic", icon));
  b.appendChild(el("span", "", label));
  b.appendChild(el("span", "n", String(n)));
  b.addEventListener("click", () => { setView(vw); closeMenu(); });
  return b;
}

function renderNav() {
  const count = vw => videos.filter(v => inView(v, vw)).length;
  const main = $("navMain"); main.innerHTML = "";
  main.appendChild(navButton({ type: "all" }, "▦", "All videos", videos.length));
  main.appendChild(navButton({ type: "new" }, "●", "New", count({ type: "new" })));
  main.appendChild(navButton({ type: "fav" }, "♥", "Favorites", count({ type: "fav" })));
  const tt = count({ type: "tiktok" }), yt = count({ type: "youtube" });
  if (tt && yt) {
    main.appendChild(navButton({ type: "tiktok" }, "♪", "TikTok", tt));
    main.appendChild(navButton({ type: "youtube" }, "▶", "YouTube", yt));
  }

  const cats = allCategories();
  const box = $("navCats"); box.innerHTML = "";
  $("catHead").style.display = cats.length ? "" : "none";
  cats.forEach(c => box.appendChild(navButton({ type: "cat", name: c.name }, "#", c.name, c.n)));
  const unc = count({ type: "uncat" });
  if (cats.length && unc) box.appendChild(navButton({ type: "uncat" }, "○", "No category", unc));

  const creators = allCreators();
  const cbox = $("navCreators"); cbox.innerHTML = "";
  $("creatorHead").style.display = creators.length ? "" : "none";
  creators.forEach(c => cbox.appendChild(navButton({ type: "creator", name: c.name }, "☺", c.name, c.n)));

  const chips = $("chips"); chips.innerHTML = "";
  const chipList = [{ type: "all" }, { type: "new" }, { type: "fav" }]
    .concat(tt && yt ? [{ type: "tiktok" }, { type: "youtube" }] : [], cats.map(c => ({ type: "cat", name: c.name })));
  if (!chipList.some(vw => sameView(vw, view))) chipList.push(view); // e.g. a creator picked in the menu
  chipList.forEach(vw => {
    const c = el("button", "chip" + (sameView(vw, view) ? " on" : ""), viewLabel(vw));
    c.type = "button";
    c.addEventListener("click", () => setView(vw));
    chips.appendChild(c);
  });
}

function renderGrid() {
  current = videos.filter(v => inView(v, view) && matchesQuery(v));
  const line = $("viewLine"); line.innerHTML = "";
  line.appendChild(el("b", "", viewLabel(view)));
  line.appendChild(document.createTextNode(" · " + current.length + (current.length === 1 ? " video" : " videos") +
    (query ? " matching “" + query + "”" : "")));
  const grid = $("grid"); grid.innerHTML = "";
  if (!videos.length) { grid.appendChild(el("p", "status", "Nothing here yet. Videos from Mom and Dad will show up here.")); return; }
  if (!current.length) {
    const msg = query ? "No videos match “" + query + "”."
      : view.type === "fav" ? "No favorites yet. Tap the heart on a video to save it here."
      : view.type === "new" ? "You're all caught up!" : "No videos here yet.";
    grid.appendChild(el("p", "status", msg)); return;
  }
  current.forEach((v, i) => grid.appendChild(card(v, i)));
}

function subLine(v) {
  const bits = [];
  if (v.who) bits.push(v.who);
  if (v.from) bits.push("from " + v.from);
  return bits.join(" · ");
}

function card(v, i) {
  const c = el("div", "card");
  const open = el("button", "open"); open.type = "button";
  const th = el("div", "thumb");
  setPicture(th, v);
  if (!seen[v.link]) th.appendChild(el("span", "badge-new", "NEW"));
  open.appendChild(th);
  const info = el("div", "info");
  info.appendChild(el("div", "t", v.note || v.title || "Video"));
  info.appendChild(el("div", "sub", subLine(v) || " "));
  open.appendChild(info);
  open.addEventListener("click", () => openPlayer(i));
  c.appendChild(open);

  const f = el("button", "fav"); f.type = "button";
  f.setAttribute("aria-label", favs[v.link] ? "Remove from favorites" : "Add to favorites");
  f.innerHTML = favs[v.link] ? HEART_ON : HEART_OFF;
  f.addEventListener("click", e => { e.stopPropagation(); toggleFav(v); });
  c.appendChild(f);
  return c;
}

function setView(vw) { view = vw; store.set("lastView", vw); renderNav(); renderGrid(); window.scrollTo(0, 0); }
function toggleFav(v) {
  if (favs[v.link]) delete favs[v.link]; else favs[v.link] = Date.now();
  store.set("favVideos", favs);
  if ($("player").classList.contains("open")) updatePlayerButtons();
  else { renderNav(); renderGrid(); }
}

/* ---------- Menu + search ---------- */
function openMenu() { document.body.classList.add("menu-open"); }
function closeMenu() { document.body.classList.remove("menu-open"); }
$("menuBtn").addEventListener("click", openMenu);
$("scrim").addEventListener("click", closeMenu);

$("searchBtn").addEventListener("click", () => {
  const on = !document.body.classList.contains("searching");
  document.body.classList.toggle("searching", on);
  $("searchBtn").classList.toggle("on", on);
  if (on) $("search").focus();
  else { $("search").value = ""; setQuery(""); }
});
function setQuery(q) {
  query = q.trim();
  document.body.classList.toggle("has-query", !!query);
  renderGrid();
}
$("search").addEventListener("input", e => setQuery(e.target.value));
$("search").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("searchClear").addEventListener("click", () => { $("search").value = ""; setQuery(""); $("search").focus(); });

/* ---------- Swipe player ---------- */
// Every video in the current list is a full-screen slide; swiping snaps to the next one.
// Only the slide on screen holds a live TikTok player, so just one video plays at a time.
function slide(v, i) {
  const s = el("section", "slide"); s.dataset.i = i;
  const frame = el("div", "sframe");
  s._placeholder = () => { frame.innerHTML = ""; const p = el("div", "splace"); setPicture(p, v); frame.appendChild(p); };
  s._placeholder();
  s.appendChild(frame);
  const info = el("div", "sinfo");
  info.appendChild(el("div", "snote", v.note || v.title || "Video"));
  const bits = [subLine(v)]; if (v.cats.length) bits.push(v.cats.map(c => "#" + c).join(" "));
  info.appendChild(el("div", "smeta", bits.filter(Boolean).join(" · ")));
  info.appendChild(el("div", "shint", i < current.length - 1 ? "Swipe up for the next video" : "That's the last one 🎉"));
  s.appendChild(info);
  return s;
}

function openPlayer(i) {
  const feed = $("feed"); feed.innerHTML = "";
  current.forEach((v, idx) => feed.appendChild(slide(v, idx)));
  $("player").classList.add("open"); document.body.classList.add("locked");
  activeIndex = -1;
  feed.scrollTop = i * feed.clientHeight;
  activate(i);
}

function activate(i) {
  if (i < 0 || i >= current.length || i === activeIndex) return;
  const feed = $("feed");
  if (activeIndex >= 0 && feed.children[activeIndex]) feed.children[activeIndex]._placeholder();
  activeIndex = i;
  const v = current[i];
  const frame = feed.children[i].querySelector(".sframe");
  const f = document.createElement("iframe");
  f.src = playerUrl(v);
  f.allow = "autoplay; fullscreen; encrypted-media";
  f.setAttribute("allowfullscreen", "");
  f.title = "Video";
  frame.innerHTML = ""; frame.appendChild(f);
  ytState = null;
  if (v.platform === "youtube") f.addEventListener("load", () => ytHello(f));
  if (!seen[v.link]) { seen[v.link] = Date.now(); store.set("seenVideos", seen); }
  updatePlayerButtons();
}

function goTo(i) {
  if (i < 0 || i >= current.length) return;
  const feed = $("feed");
  feed.scrollTo({ top: i * feed.clientHeight, behavior: "smooth" });
}

let settle = null;
$("feed").addEventListener("scroll", () => {
  clearTimeout(settle);
  settle = setTimeout(() => {
    const feed = $("feed");
    activate(Math.round(feed.scrollTop / Math.max(1, feed.clientHeight)));
  }, 140);
}, { passive: true });

function updatePlayerButtons() {
  const v = current[activeIndex]; if (!v) return;
  $("pFav").innerHTML = favs[v.link] ? HEART_ON : HEART_OFF;
  $("pFav").setAttribute("aria-label", favs[v.link] ? "Remove from favorites" : "Add to favorites");
  $("pUp").disabled = activeIndex === 0;
  $("pDown").disabled = activeIndex === current.length - 1;
  $("pPos").textContent = (activeIndex + 1) + " of " + current.length;
  $("pAuto").classList.toggle("on", autoNext);
  $("pSpeed").style.display = v.platform === "youtube" ? "" : "none";
  $("pSpeed").textContent = ytSpeed + "x";
  $("pSpeed").classList.toggle("on", ytSpeed !== 1);
  $("pAuto").textContent = autoNext ? "Auto-next on" : "Auto-next off";
}

function closePlayer() {
  $("player").classList.remove("open"); document.body.classList.remove("locked");
  $("feed").innerHTML = ""; activeIndex = -1;
  renderNav(); renderGrid();
}
$("pClose").addEventListener("click", closePlayer);
$("pUp").addEventListener("click", () => goTo(activeIndex - 1));
$("pDown").addEventListener("click", () => goTo(activeIndex + 1));
$("pFav").addEventListener("click", () => { const v = current[activeIndex]; if (v) toggleFav(v); });
$("pAuto").addEventListener("click", () => { autoNext = !autoNext; store.set("autoNext", autoNext); updatePlayerButtons(); });

// YouTube's player is driven by messages too: ask it to report its state, and set the speed.
let ytSpeed = store.get("ytSpeed", 1);
let ytState = null;
function ytSend(f, func, args) {
  try { f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args: args || [], id: 1, channel: "widget" }), "*"); } catch (e) {}
}
function ytHello(f) {
  // Repeated a few times because the player takes a moment to start listening.
  [0, 600, 1500, 3000].forEach(ms => setTimeout(() => {
    if (!f.isConnected) return;
    try { f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*"); } catch (e) {}
    ytSend(f, "addEventListener", ["onStateChange"]);
    ytSend(f, "setPlaybackRate", [ytSpeed]);
  }, ms));
}
$("pSpeed").addEventListener("click", () => {
  ytSpeed = ytSpeed === 1 ? 2 : 1; store.set("ytSpeed", ytSpeed);
  const live = $("feed").querySelector("iframe");
  if (live) ytSend(live, "setPlaybackRate", [ytSpeed]);
  updatePlayerButtons();
});

// Both players tell the page when a video ends (state 0); then move on to the next one.
window.addEventListener("message", e => {
  let host = "";
  try { host = new URL(e.origin).hostname; } catch (_) { return; }
  const live = $("feed").querySelector("iframe");
  if (!live || e.source !== live.contentWindow) return;
  let d = e.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch (_) { return; } }
  if (!d) return;
  let state = null;
  if (/(^|\.)tiktok\.com$/.test(host)) {
    if (d["x-tiktok-player"] && d.type === "onStateChange") state = Number(d.value);
  } else if (/(^|\.)(youtube\.com|youtube-nocookie\.com)$/.test(host)) {
    let ys = null;
    if (d.event === "onStateChange") ys = Number(d.info);
    else if (d.event === "infoDelivery" && d.info && typeof d.info.playerState === "number") ys = d.info.playerState;
    if (ys === null || ys === ytState) return;   // only act when the state changes
    ytState = ys; state = ys;
    if (ys === 1 && ytSpeed !== 1) ytSend(live, "setPlaybackRate", [ytSpeed]);
  } else return;
  if (state === 0 && autoNext && activeIndex < current.length - 1) goTo(activeIndex + 1);
});

/* ---------- Load ---------- */
async function refresh() {
  if ($("player").classList.contains("open")) return; // don't interrupt a video
  if (!videos.length) $("grid").innerHTML = '<p class="status">Loading…</p>';
  try {
    const url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET_ID) +
      "/gviz/tq?tqx=out:csv" + (SHEET_TAB ? "&sheet=" + encodeURIComponent(SHEET_TAB) : "") + "&_=" + Date.now();
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = parseCSV(await r.text()).slice(1);
    const seenLinks = new Set();
    const entries = rows
      .map(c => ({ link: (c[0] || "").trim(), note: (c[1] || "").trim(), from: (c[2] || "").trim(), cats: splitCats(c[3]) }))
      .filter(e => platformOf(e.link) && !isProfile(e.link) && !seenLinks.has(e.link) && seenLinks.add(e.link))
      .reverse(); // newest (bottom of sheet) first
    const looked = await Promise.all(entries.map(e => lookup(e.link, platformOf(e.link))));
    store.set("videoMeta3", meta);
    videos = entries.map((e, i) => looked[i] ? Object.assign({}, e, looked[i]) : null).filter(Boolean);
    if (view.type === "cat" && !allCategories().some(c => c.name === view.name)) view = { type: "all" };
    if (view.type === "creator" && !allCreators().some(c => c.name === view.name)) view = { type: "all" };
    renderNav(); renderGrid();
  } catch (e) {
    if (!videos.length) $("grid").innerHTML = '<p class="status">Couldn\'t load videos. Check the internet connection and tap Refresh.</p>';
  }
}
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
</script>
